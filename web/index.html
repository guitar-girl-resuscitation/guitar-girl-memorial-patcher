<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guitar Girl Fan Memorial Build Patcher</title>
<style>
  :root{color-scheme:light;--pink:#ef5f87;--ink:#512d3a;--paper:#fff9fb;--line:#f1ced9}
  *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#ffe8ef,#fff 52%,#fff2cd);color:var(--ink);font:16px/1.55 system-ui,sans-serif;min-height:100vh}
  main{max-width:760px;margin:auto;padding:7vh 20px}section{background:#fffcfdde;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 80px #ad62712c}
  h1{font-size:clamp(27px,5vw,44px);line-height:1.08;margin:0 0 12px}p{margin:8px 0}.muted{color:#84606c}label.drop{display:block;border:2px dashed #ef9ab3;border-radius:18px;padding:28px;margin:24px 0;text-align:center;cursor:pointer;background:#fff}
  input[type=file]{position:absolute;opacity:0;width:1px;height:1px}button,a.button{appearance:none;border:0;border-radius:999px;padding:12px 19px;font-weight:700;background:var(--pink);color:white;text-decoration:none;cursor:pointer;margin:5px}button.secondary{background:#845e6b}button:disabled{opacity:.45;cursor:not-allowed}
  progress{width:100%;height:13px;accent-color:var(--pink)}#status{white-space:pre-wrap;min-height:3em;background:#fff4f7;border-radius:14px;padding:13px;margin-top:18px}.actions{display:flex;flex-wrap:wrap;justify-content:center}.hash{font:12px ui-monospace,monospace;overflow-wrap:anywhere}
</style>
<main><section>
  <h1>Guitar Girl<br>Fan Memorial Build</h1>
  <p>选择你自己持有的原版 XAPK。文件会先在浏览器中分块计算 SHA-256；不匹配的版本不会上传。</p>
  <p class="muted">公开源码不包含游戏。完整上传模式会删除临时原包；部署者启用私有预置模式后，校验通过即可下载已缓存成品，仅上传随机校验分块。</p>
  <label class="drop" for="source"><strong>选择 Guitar Girl 8.0.0 XAPK</strong><br><span id="filename" class="muted">尚未选择</span></label>
  <input id="source" type="file" accept=".xapk,application/zip">
  <progress id="progress" max="1" value="0"></progress>
  <p id="hash" class="hash"></p>
  <div class="actions">
    <button id="upload" disabled>读取配置中……</button>
  </div>
  <div id="status">正在读取部署配置……</div>
</section></main>
<script>
const $=id=>document.getElementById(id), source=$('source'), status=$('status'), progress=$('progress');
let file=null, digest='', health=null, selection=0, busy=false;
class SHA256{constructor(){this.h=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);this.b=new Uint8Array(64);this.n=0;this.p=0}block(x){const k=SHA256.k,w=new Uint32Array(64);for(let i=0;i<16;i++)w[i]=(x[i*4]<<24)|(x[i*4+1]<<16)|(x[i*4+2]<<8)|x[i*4+3];for(let i=16;i<64;i++){let a=w[i-15],b=w[i-2];w[i]=(((a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3))+w[i-16]+((b>>>17|b<<15)^(b>>>19|b<<13)^(b>>>10))+w[i-7])>>>0}let[a,b,c,d,e,f,g,h]=this.h;for(let i=0;i<64;i++){let s1=(e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7),ch=(e&f)^(~e&g),t1=(h+s1+ch+k[i]+w[i])>>>0,s0=(a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10),maj=(a&b)^(a&c)^(b&c),t2=(s0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}let q=[a,b,c,d,e,f,g,h];for(let i=0;i<8;i++)this.h[i]=(this.h[i]+q[i])>>>0}update(x){this.n+=x.length;for(let i=0;i<x.length;i++){this.b[this.p++]=x[i];if(this.p===64){this.block(this.b);this.p=0}}}hex(){const bits=this.n*8;this.b[this.p++]=0x80;if(this.p>56){while(this.p<64)this.b[this.p++]=0;this.block(this.b);this.p=0}while(this.p<56)this.b[this.p++]=0;const hi=Math.floor(bits/4294967296),lo=bits>>>0;for(let i=3;i>=0;i--)this.b[this.p++]=(hi>>>(i*8))&255;for(let i=3;i>=0;i--)this.b[this.p++]=(lo>>>(i*8))&255;this.block(this.b);return[...this.h].map(v=>v.toString(16).padStart(8,'0')).join('').toUpperCase()}}
SHA256.k=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
async function hashFile(f,generation){const s=new SHA256(),size=4*1024*1024;for(let o=0;o<f.size;o+=size){if(generation!==selection)throw Error('selection changed');s.update(new Uint8Array(await f.slice(o,o+size).arrayBuffer()));progress.value=Math.min(1,(o+size)/f.size);await new Promise(requestAnimationFrame)}return s.hex()}
function enable(ok){$('upload').disabled=!ok||busy||!health}
source.onchange=async()=>{const generation=++selection;file=source.files[0];digest='';enable(false);if(!file)return;const selected=file;$('filename').textContent=selected.name;progress.value=0;status.textContent='正在本地分块计算 SHA-256……';try{if(selected.size>768*1024*1024)throw Error('文件超过 768 MiB 上限');await ready;const calculated=await hashFile(selected,generation);if(generation!==selection)return;digest=calculated;$('hash').textContent=digest;const ok=digest===health.sourceSha256.toUpperCase();status.textContent=ok?(health.prebuiltEnabled?'版本匹配，部署者已有成品：只需分块验证，无须完整上传或重新 Patch。':'版本匹配：需要完整上传，完成后提供下载。'):'这个文件不在兼容清单中，不会上传。';enable(ok)}catch(e){if(generation===selection)status.textContent=e.message}};
async function json(url,opt){const r=await fetch(url,opt),b=await r.json().catch(()=>({error:`HTTP ${r.status}`}));if(!r.ok){const retry=Number(r.headers.get('Retry-After'));throw Error((b.error||`HTTP ${r.status}`)+(Number.isFinite(retry)&&retry>0?`（请在 ${Math.ceil(retry)} 秒后重试）`:''))}return b}
function download(result){const a=document.createElement('a');a.href=`/api/v1/download/${encodeURIComponent(result.downloadToken)}`;a.className='button';a.textContent='下载已完成的纪念版 XAPK';$('status').replaceChildren(document.createTextNode('Patch 已完成。下载令牌十分钟内且仅可使用一次。'),document.createElement('br'),a)}
function b64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out)}
$('upload').onclick=async()=>{if(busy||!file||!health||digest!==health.sourceSha256.toUpperCase())return;busy=true;source.disabled=true;enable(false);try{if(health.prebuiltEnabled){status.textContent='正在验证随机分块，不会重新构建……';const c=await json('/api/v1/prebuilt/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceSha256:digest})});if(Number(c.sourceSize)!==file.size||!Array.isArray(c.offsets)||c.offsets.length>16||c.chunkSize>1048576||c.chunkSize<4096)throw Error('无效的校验挑战');const chunks=[];for(const offset of c.offsets){if(!Number.isSafeInteger(offset)||offset<0||offset+c.chunkSize>file.size)throw Error('无效的校验范围');chunks.push(b64(new Uint8Array(await file.slice(offset,offset+c.chunkSize).arrayBuffer())))}download(await json('/api/v1/prebuilt/prove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proof:{nonce:c.nonce,chunksBase64:chunks}})}))}else{status.textContent='正在完整上传并 Patch；服务端仅运行一个构建，请稍候……';download(await json('/api/v1/patch',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file}))}}catch(e){status.textContent=e.message}finally{busy=false;source.disabled=false;enable(true)}};
const ready=json('/healthz').then(h=>{health=h;$('upload').textContent=h.prebuiltEnabled?'验证并下载纪念版':'完整上传并 Patch';if(!file)status.textContent=`支持 Guitar Girl ${h.sourceVersion}\nSHA-256: ${h.sourceSha256}`;return h});
ready.catch(e=>{status.textContent='无法读取部署配置：'+e.message;enable(false)});
</script>
</html>
