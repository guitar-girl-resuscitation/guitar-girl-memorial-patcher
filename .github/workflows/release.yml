name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patcher-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: 2
  # Stable on re-runs; increases for each new run of this release workflow.
  GGFM_BUILD_REVISION: ${{ github.run_number }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit both exact source trees
        run: |
          python tools/release_guard.py --history
          python patch/tools/release_guard.py --history
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Test protocol package validation and browser hashing
        run: |
          cargo test --workspace --locked -j2
          node tools/test-browser-sha256.mjs
          python tools/test_deployment.py
          python tools/test_docker.py
          cd patch
          python -m unittest discover -s tests -v
      - name: Compile CLI and web service
        run: cargo build --workspace --locked --release -j2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install bounded native build toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Build matched standalone runtime from pinned Patch source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python patch/tools/build_runtime.py --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --output "$GITHUB_WORKSPACE/build/docker-runtime"
      - name: Package original software only
        run: >-
          python tools/release_artifacts.py pack --kind patcher-linux-x64
          --file ggfm-patcher=target/release/ggfm-patcher
          --file ggfm-patcher-web=target/release/ggfm-patcher-web
          --file patcher.example.json=config/patcher.example.json
          --file DEPLOYMENT.md=docs/DEPLOYMENT.md
          --file PUBLIC_DEPLOYMENT.md=docs/PUBLIC_DEPLOYMENT.md
          --file VERSIONING.md=docs/VERSIONING.md
          --file deploy/cloudflared.yml=deploy/cloudflared.yml
          --file deploy/ggfm-patcher.service=deploy/ggfm-patcher.service
      - name: Package resource-free Docker deployment context
        run: python tools/docker_bundle.py --runtime build/docker-runtime
      - name: Build Dockerfile and smoke-test upload-only startup
        run: |
          docker build --platform linux/amd64 -t ggfm-patcher:ci build/docker-context
          python tools/smoke_docker.py ggfm-patcher:ci
      - uses: actions/upload-artifact@v4
        with:
          name: patcher-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patcher-release
          path: dist
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
        run: python tools/release_artifacts.py publish --tag "$RELEASE_TAG"
